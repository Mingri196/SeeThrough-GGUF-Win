<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>设置 · SeeThrough GGUF</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  html, body {
    margin: 0;
    height: auto !important;
    min-height: 100vh;
    overflow-y: auto !important;
    overflow-x: hidden;
  }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); }

  .app { min-height: 100vh; }

  .rail {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 208px;
    box-sizing: border-box;
    padding: 22px 0 16px;
    background: var(--paper-raised);
    border-right: 1px solid var(--line-strong);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .rail-head { padding: 0 18px 14px; }
  .rail-head h1 { margin: 0 0 2px; font-size: 16px; font-weight: 500; }
  .rail-nav { display: flex; flex-direction: column; }
  .rail-nav a {
    display: block;
    padding: 8px 18px;
    font-size: 12.5px;
    color: var(--ink-muted);
    text-decoration: none;
    border-left: 2px solid transparent;
  }
  .rail-nav a:hover { color: var(--ink); }
  .rail-nav a.active {
    color: var(--accent-deep);
    border-left-color: var(--accent);
    background: var(--accent-wash);
  }

  .pane { margin-left: 208px; min-width: 0; padding: 22px 28px 60px; }
  .pane-inner { max-width: 880px; }

  .pane-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding-bottom: 13px;
    border-bottom: 1px solid var(--line-strong);
  }
  .pane-head h2 { margin: 0; font-size: 15px; font-weight: 500; }
  .pane-head .sub { font-size: 11.5px; color: var(--ink-muted); }
  .pane-head .spacer { margin-left: auto; }

  .btn { border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink-soft);
         font-family: var(--font-body); font-size: 12px; padding: 0 10px; height: 32px; cursor: pointer;
         display: inline-flex; align-items: center; }
  .btn:hover { border-color: var(--ink); color: var(--ink); }
  .btn.primary { border-color: var(--accent); color: var(--accent-deep); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  section { margin-top: 20px; }
  section:first-of-type { margin-top: 18px; }
  section > h3 { font-size: 12px; font-weight: 500; color: var(--ink-muted); letter-spacing: .06em;
                 margin: 0 0 8px; text-transform: uppercase; }
  .rows { border: 1px solid var(--line); background: var(--paper-raised); }
  .row { display: flex; gap: 14px; align-items: baseline; padding: 9px 12px; border-bottom: 1px solid var(--line-faint); }
  .row:last-child { border-bottom: 0; }
  .row .k { flex: 0 0 132px; font-size: 12px; color: var(--ink-muted); }
  .row .v { flex: 1 1 auto; min-width: 0; font-family: var(--font-mono); font-size: 12px; color: var(--ink); word-break: break-all; }
  .v .dim { color: var(--ink-muted); }
  .tag { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border: 1px solid var(--line-strong); color: var(--ink-muted); }
  .tag.ok { border-color: rgba(44,103,66,.45); color: var(--ok); background: rgba(44,103,66,.07); }
  .tag.warn { border-color: rgba(138,90,18,.45); color: var(--warn); background: rgba(138,90,18,.07); }
  .tag.off { border-color: var(--line); color: var(--ink-muted); background: var(--paper-sunk); }
  table.models { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 11.5px;
                 background: var(--paper-raised); border: 1px solid var(--line); }
  table.models th, table.models td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line-faint); }
  table.models th { color: var(--ink-muted); font-weight: 400; font-size: 11px; }
  table.models td.num { text-align: right; white-space: nowrap; }
  .empty { padding: 14px 12px; font-size: 12px; color: var(--ink-muted); margin: 0; }
  .foot { margin-top: 22px; font-size: 11px; color: var(--ink-muted); line-height: 1.7; }
  .skel { height: 132px; border: 1px solid var(--line-faint); background: var(--paper-sunk); }

  .edit-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .edit-input {
    height: 28px; padding: 0 8px; width: 190px; box-sizing: border-box;
    border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink);
    font-family: var(--font-mono); font-size: 12px;
  }
  .edit-input:focus { outline: none; border-color: var(--accent); }
  .save-btn {
    height: 28px; padding: 0 12px; border: 1px solid var(--accent); background: var(--paper-raised);
    color: var(--accent-deep); font-family: var(--font-body); font-size: 12px; cursor: pointer;
  }
  .save-btn:hover { background: var(--accent-wash); }
  .save-btn:disabled { opacity: .45; cursor: not-allowed; background: var(--paper-sunk); }
  .save-state { font-family: var(--font-body); font-size: 11px; color: var(--ink-muted); }
  .save-state.err { color: var(--warn); }
  .save-state.ok { color: var(--ok); }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .actions .note { font-size: 11px; color: var(--ink-muted); }
  .hint { margin: 10px 0 0; padding: 9px 12px; border: 1px solid var(--line); background: var(--paper-raised);
          border-left: 3px solid var(--line-strong); font-size: 11.5px; color: var(--ink-muted); line-height: 1.7; }
  .hint b { color: var(--ink-soft); font-weight: 500; }

  @media (max-width: 820px) {
    .rail { position: static; width: auto; height: auto; flex-direction: row; align-items: center; gap: 10px;
            padding: 12px 14px; border-right: 0; border-bottom: 1px solid var(--line-strong); overflow: visible; }
    .rail-head { padding: 0; }
    .rail-nav { flex-direction: row; }
    .rail-nav a { border-left: 0; border-bottom: 2px solid transparent; padding: 6px 10px; }
    .rail-nav a.active { border-left-color: transparent; border-bottom-color: var(--accent); }
    .pane { margin-left: 0; padding: 18px 16px 48px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <h1 data-i18n="rail.title">设置</h1>
    </div>
    <nav class="rail-nav" id="railNav">
      <a href="#env" data-view="env" data-i18n="nav.env">环境信息</a>
      <a href="#startup" data-view="startup" data-i18n="nav.startup">启动与端口</a>
      <a href="#maint" data-view="maint" data-i18n="nav.maint">维护与诊断</a>
    </nav>
  </aside>

  <main class="pane">
    <div class="pane-inner">

      <!-- ───────── 环境信息 ───────── -->
      <div class="view" id="view-env">
        <header class="pane-head">
          <h2 data-i18n="title.env">环境信息</h2>
          <span class="sub" data-i18n="head.env.sub">运行时、硬件与补丁状态</span>
          <span class="spacer"><button class="btn primary" id="copyBtn" type="button" data-i18n="btn.copy">复制诊断</button></span>
        </header>
        <div id="content"><div class="skel"></div></div>
        <p class="foot" data-i18n-html="foot.env"></p>
      </div>

      <!-- ───────── 启动与端口 ───────── -->
      <div class="view" id="view-startup" hidden>
        <header class="pane-head">
          <h2 data-i18n="title.startup">启动与端口</h2>
          <span class="sub" data-i18n="head.startup.sub">监听地址、进程与 config.json</span>
        </header>
        <div id="content-startup"><div class="skel"></div></div>
        <div class="hint" data-i18n-html="hint.startup"></div>
      </div>

      <!-- ───────── 维护与诊断 ───────── -->
      <div class="view" id="view-maint" hidden>
        <header class="pane-head">
          <h2 data-i18n="title.maint">维护与诊断</h2>
          <span class="sub" data-i18n="head.maint.sub">完整性检查与常用目录</span>
          <span class="spacer"><button class="btn primary" id="termBtn" type="button" data-i18n="btn.terminal">打开命令提示符</button></span>
        </header>
        <div id="content-maint"><div class="skel"></div></div>
        <div class="actions">
          <button class="btn" type="button" data-target="outputs" data-i18n="btn.openOutputs">打开 outputs</button>
          <button class="btn" type="button" data-target="models" data-i18n="btn.openModels">打开 models</button>
          <button class="btn" type="button" data-target="root" data-i18n="btn.openRoot">打开项目根</button>
          <span class="note" id="maintNote"></span>
        </div>
        <p class="foot" data-i18n-html="foot.maint"></p>
      </div>

    </div>
  </main>
</div>

      "note.noResponse": "Open failed: no response from the service",
      "note.termSending": "Opening…",
      "note.termOpened": "Command prompt opened (with .venv activated)",
      "note.termFail": "Open failed: {error}",
      "err.localOnly": "Only the local machine (127.0.0.1) can {action}",
      "err.unsupported": "Windows only",
      "err.missingEnvBat": "3-env.bat is missing; re-run 1-setup.bat",
      "err.spawnFailed": "Failed to start",
      "err.invalidTarget": "Invalid target",
      "err.notFound": "Folder not found",
      "err.openFailed": "Open failed",
      "err.unknown": "Unknown error",
      "err.readFail": "Failed to read environment info: the service is not running or the API failed.",

      "unit.day": "d",
      "unit.hour": "h",
      "unit.min": "m",
      "unit.sec": "s",

      "diag.title": "SeeThrough-GGUF-Win environment diagnostics",
      "diag.gpu": "GPU",
      "diag.os": "OS",
      "diag.extra": "xformers",
      "diag.patch": "Patches",
      "diag.models": "Models",
      "diag.hf": "Download source",
      "diag.listen": "Listen",
      "diag.jobs": "Jobs",
      "diag.disk": "Disk free",
      "diag.path": "Path",
      "diag.auto": "auto"
    }
  };

  // ?lang=en / ?lang=zh 可强制语言（便于分享或截图）；否则跟随工作台的 stg.lang，并实时响应切换
  var lang = params.get("lang") === "en" ? "en"
    : params.get("lang") === "zh" ? "zh"
    : (localStorage.getItem(LS_LANG) === "en" ? "en" : "zh");

  var data = null;
  var VIEWS = ["env", "startup", "maint"];

  function t(key, vars) {
    var dict = I18N[lang] || I18N.zh;
    var text = dict[key] != null ? dict[key] : (I18N.zh[key] != null ? I18N.zh[key] : key);
    if (vars) {
      Object.keys(vars).forEach(function (name) {
        text = text.replace(new RegExp("\\{" + name + "\\}", "g"), vars[name]);
      });
    }
    return text;
  }

  function el(id) { return document.getElementById(id); }

  function esc(text) {
    return String(text == null ? "" : text).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function gb(mb) { return (mb / 1024).toFixed(1) + " GB"; }

  function row(key, valueHtml) {
    return '<div class="row"><span class="k">' + esc(key) + '</span><span class="v">' + valueHtml + "</span></div>";
  }

  function plain(value) { return value == null || value === "" ? '<span class="dim">—</span>' : esc(value); }

  function tag(ok, okText, badText) {
    return ok ? '<span class="tag ok">' + esc(okText) + "</span>" : '<span class="tag warn">' + esc(badText) + "</span>";
  }

  function section(title, body) {
    return "<section><h3>" + esc(title) + "</h3>" + body + "</section>";
  }

  function uptime(seconds) {
    var s = Math.max(0, Math.floor(seconds || 0));
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600;
    var m = Math.floor(s / 60); s -= m * 60;
    var out = [];
    var sep = lang === "zh" ? "" : " ";
    if (d) out.push(d + sep + t("unit.day"));
    if (h) out.push(h + sep + t("unit.hour"));
    if (m) out.push(m + sep + t("unit.min"));
    if (!d && !h) out.push(s + sep + t("unit.sec"));
    return out.join(" ");
  }

  var upTimer = null;

  function currentUptime() {
    if (!data || !data.server) return 0;
    var srv = data.server;
    // 用绝对启动时刻在本地推算，避免每秒请求接口、也不会随刷新漂移
    if (srv.started_epoch) return Date.now() / 1000 - srv.started_epoch;
    return srv.uptime_s || 0;
  }

  function tickUptime() {
    var text = uptime(currentUptime());
    Array.prototype.forEach.call(document.querySelectorAll(".uptime"), function (node) {
      node.textContent = text;
    });
  }

  function startUptimeTick() {
    if (upTimer) return;
    tickUptime();
    upTimer = setInterval(tickUptime, 1000);
  }

  function bytes(n) {
    if (!n) return "0 B";
    return n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB";
  }

  /* ───────────────────────── 环境信息 ───────────────────────── */
  function componentsCell() {
    var c = data.components || {};
    if (!c.hf_home) return '<span class="dim">—</span>';
    var srcTag = c.source === "project"
      ? '<span class="tag ok">' + esc(t("tag.compProject")) + "</span>"
      : '<span class="tag off">' + esc(t("tag.compUser")) + "</span>";
    var size = (c.size_gb || 0) + " GB" + (c.files ? " · " + c.files + " " + t("unit.files") : "");
    return esc(c.hf_home) + " " + srcTag + ' <span class="dim">' + esc(size) + "</span>";
  }

  function renderEnv() {
    var gpu = (data.hardware || {}).gpu;
    var hw = data.hardware || {};
    var rt = data.runtime || {};
    var cfg = data.config || {};
    var patches = data.patches || {};
    var disk = data.disk || {};
    var models = data.models || [];
    var attention = cfg.attention_available || {};

    var html = "";

    html += section(t("sec.runtime"), '<div class="rows">' +
      row(t("row.python"), plain(rt.python) + ' <span class="dim">' + esc(rt.executable || "") + "</span>") +
      row(t("row.torch"), plain(rt.torch) + (rt.cuda ? ' <span class="dim">/ CUDA ' + esc(rt.cuda) + "</span>" : "")) +
      row(t("row.xformers"), rt.xformers ? '<span class="tag ok">' + esc(rt.xformers) + "</span>"
                                   : '<span class="tag off">' + esc(t("tag.notInstalled")) + "</span>") +
      row(t("row.triton"), rt.triton ? '<span class="tag ok">' + esc(rt.triton) + "</span>"
                                       : '<span class="tag off">' + esc(t("tag.notInstalled")) + "</span>") +
      "</div>");

    var source = hw.hf_endpoint
      ? esc(hw.hf_endpoint) + (hw.hf_latency_ms != null
          ? ' <span class="tag ok">' + esc(hw.hf_latency_ms + " ms") + "</span>"
          : ' <span class="tag off">' + esc(t("tag.noLatency")) + "</span>")
      : '<span class="dim">' + esc(t("tag.autoDetect")) + "</span>";

    html += section(t("sec.hw"), '<div class="rows">' +
      row(t("row.gpu"), gpu ? esc(gpu.name) : '<span class="tag warn">' + esc(t("tag.noGpu")) + "</span>") +
      row(t("row.vram"), gpu ? esc(gb(gpu.memory_mb)) : "—") +
      row(t("row.driver"), gpu ? esc(gpu.driver) : "—") +
      row(t("row.os"), plain(hw.os)) +
      row(t("row.cpu"), plain(hw.cpu)) +
      row(t("row.ram"), esc(hw.ram_gb ? hw.ram_gb + " GB" : "—")) +
      row(t("row.hf"), source) +
      "</div>");

    html += section(t("sec.paths"), '<div class="rows">' +
      row(t("row.root"), plain(data.paths.root)) +
      row(t("row.stm"), plain(data.paths.stm)) +
      row(t("row.modelsDir"), plain(data.paths.models)) +
      row(t("row.outputsDir"), plain(data.paths.outputs)) +
      row(t("row.components"), componentsCell()) +
      "</div>");

    var modelsBody;
    if (models.length) {
      modelsBody = '<table class="models"><thead><tr><th>' + esc(t("table.file")) + "</th><th>" +
                   esc(t("table.role")) + '</th><th class="num">' + esc(t("table.size")) + "</th></tr></thead><tbody>";
      models.forEach(function (m) {
        modelsBody += "<tr><td>" + esc(m.rel) + "</td><td>" + esc(m.role) + '</td><td class="num">' +
                      (m.size / 1024 ** 3).toFixed(2) + " GiB</td></tr>";
      });
      modelsBody += "</tbody></table>";
    } else {
      modelsBody = '<div class="rows"><p class="empty">' + esc(t("table.empty")) + "</p></div>";
    }
    html += section(t("sec.models"), modelsBody);

    html += section(t("sec.patches"), '<div class="rows">' +
      row(t("row.uselama"), tag(patches.use_lama, t("tag.applied"), t("tag.notApplied"))) +
      row(t("row.layerDrop"), tag(patches.layer_fix_drop, t("tag.applied"), t("tag.notApplied"))) +
      row(t("row.layerOrder"), tag(patches.layer_fix_order, t("tag.applied"), t("tag.notApplied"))) +
      row(t("row.compileDequant"), cfg.compile_dequant ? '<span class="tag ok">' + esc(t("tag.on")) + "</span>"
                                                       : '<span class="tag off">' + esc(t("tag.off")) + "</span>") +
      row(t("row.layerFixDefault"), cfg.layer_fix ? '<span class="tag ok">' + esc(t("tag.on")) + "</span>"
                                                  : '<span class="tag off">' + esc(t("tag.off")) + "</span>") +
      row(t("row.attention"), esc(cfg.attention_backend) + ' <span class="dim">' +
          esc(Object.keys(attention).filter(function (k) { return attention[k]; }).join(" / ")) + "</span>") +
      row(t("row.listen"), esc(cfg.host + ":" + cfg.port) + ' <span class="dim">' + esc(t("tag.restartHint")) + "</span>") +
      "</div>");

    html += section(t("sec.disk"), '<div class="rows">' +
      row(t("row.disk"), esc(disk.free_gb + " GB / " + disk.total_gb + " GB")) +
      "</div>");

    el("content").innerHTML = html;
  }

  /* ───────────────────────── 启动与端口 ───────────────────────── */
  function editRow(label, key, value, hint) {
    return '<div class="row"><span class="k">' + esc(label) + '</span><span class="v"><span class="edit-line">' +
      '<button class="save-btn" type="button" data-save="' + key + '">' + esc(t("btn.save")) + "</button>" +
      '<input class="edit-input" id="edit-' + key + '" value="' + esc(value) + '" spellcheck="false" autocomplete="off" />' +
      '<span class="save-state" id="state-' + key + '">' + (hint || "") + "</span>" +
      "</span></span></div>";
  }

  function setSaveState(key, text, kind) {
    var node = el("state-" + key);
    if (!node) return;
    node.textContent = text;
    node.className = "save-state" + (kind ? " " + kind : "");
  }

  function saveConfig(key) {
    if (!data) return;
    var host = key === "host" ? el("edit-host").value.trim() : data.config.host;
    var port = key === "port" ? Number(el("edit-port").value) : data.config.port;
    if (key === "host" && !host) { setSaveState("host", t("save.emptyHost"), "err"); return; }
    if (key === "port" && (!Number.isInteger(port) || port < 1 || port > 65535)) {
      setSaveState("port", t("save.badPort"), "err");
      return;
    }
    setSaveState(key, t("save.saving"));
    fetch("/api/config-file", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host: host, port: port })
    })
      .then(function (r) { return r.json(); })
      .then(function (payload) {
        if (!payload || !payload.ok) {
          var map = {
            invalid_host: t("save.badHost"),
            invalid_port: t("save.badPort"),
            local_only: t("save.localOnly"),
            write_failed: t("save.writeFail")
          };
          setSaveState(key, map[(payload || {}).error] || t("save.fail"), "err");
          return;
        }
        data.config.host = payload.host;
        data.config.port = payload.port;
        data.server.config_stale = true;
        renderStartup();
        var text = payload.unchanged ? t("save.same")
          : payload.port_in_use ? t("save.busyPort")
          : t("save.ok");
        setSaveState(key, text, payload.port_in_use ? "err" : "ok");
      })
      .catch(function () { setSaveState(key, t("save.netFail"), "err"); });
  }

  function wireStartup() {
    var local = !(data && data.server && data.server.local_request === false);
    Array.prototype.forEach.call(document.querySelectorAll("#content-startup [data-save]"), function (btn) {
      if (!local) { btn.disabled = true; return; }
      btn.addEventListener("click", function () { saveConfig(btn.dataset.save); });
    });
    ["host", "port"].forEach(function (key) {
      var input = el("edit-" + key);
      if (!input) return;
      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") { event.preventDefault(); saveConfig(key); }
      });
    });
  }

  function renderStartup() {
    var cfg = data.config || {};
    var srv = data.server || {};
    var cf = data.config_file || {};

    var lan = cfg.host && cfg.host !== "127.0.0.1" && cfg.host !== "localhost";
    var stale = !!srv.config_stale;
    var local = srv.local_request !== false;

    var html = "";

    html += section(t("sec.listen"), '<div class="rows">' +
      row(t("row.configuredAddr"), esc(cfg.host) + " " +
          (lan ? '<span class="tag warn">' + esc(t("tag.lan")) + "</span>"
               : '<span class="tag ok">' + esc(t("tag.localOnly")) + "</span>") +
          (stale ? ' <span class="tag warn">' + esc(t("tag.stale")) + "</span>" : "")) +
      row(t("row.configuredPort"), esc(String(cfg.port))) +
      editRow(t("row.changeHost"), "host", cfg.host, local ? "" : esc(t("save.localOnlyHint"))) +
      editRow(t("row.changePort"), "port", cfg.port, local ? "" : esc(t("save.localOnlyHint"))) +
      row(t("row.entry"), esc(cfg.host === "0.0.0.0"
          ? "http://<LAN IP>:" + cfg.port
          : "http://localhost:" + cfg.port)) +
      "</div>");

    html += section(t("sec.process"), '<div class="rows">' +
      row(t("row.pid"), plain(srv.pid)) +
      row(t("row.startedAt"), plain(srv.started_at)) +
      row(t("row.uptime"), '<span class="uptime">' + esc(uptime(srv.uptime_s)) + "</span>") +
      row(t("row.cwd"), plain(srv.cwd)) +
      "</div>");

    html += section(t("sec.configFile"), '<div class="rows">' +
      row(t("row.path"), plain(cf.path)) +
      row(t("row.modified"), plain(cf.mtime) + (cf.exists ? "" : ' <span class="tag warn">' + esc(t("tag.noFile")) + "</span>")) +
      row(t("row.size"), esc(bytes(cf.size))) +
      "</div>");

    el("content-startup").innerHTML = html;
    wireStartup();
  }

  /* ───────────────────────── 维护与诊断 ───────────────────────── */
  function renderMaint() {
    var m = data.maintenance || {};
    var srv = data.server || {};
    var rt = data.runtime || {};
    var patches = data.patches || {};
    var models = data.models || [];
    var outs = m.outputs || {};
    var stmFiles = m.stm_files || {};

    var roles = {};
    models.forEach(function (item) { roles[item.role] = item; });

    var patchKeys = ["use_lama", "layer_fix_drop", "layer_fix_order"];
    var patchDone = patchKeys.filter(function (k) { return patches[k]; }).length;

    var stmKeys = Object.keys(stmFiles);
    var stmOk = stmKeys.filter(function (k) { return stmFiles[k]; }).length;

    var html = "";

    html += section(t("sec.service"), '<div class="rows">' +
      row(t("row.status"), '<span class="tag ok">' + esc(t("tag.running")) + '</span> <span class="dim">PID ' + esc(srv.pid) +
          ' · ' + esc(t("row.uptime")) + ' <span class="uptime">' + esc(uptime(srv.uptime_s)) + "</span></span>") +
      row(t("row.python"), plain(rt.python) + ' <span class="dim">' + esc(rt.executable || "") + "</span>") +
      row("torch / CUDA", esc((rt.torch || "—") + " / " + (rt.cuda || "—"))) +
      "</div>");

    html += section(t("sec.integrity"), '<div class="rows">' +
      row(t("row.venv"), tag(m.venv, t("tag.ready"), t("tag.venvMissing"))) +
      row(t("row.stmCode"), tag(stmOk === stmKeys.length && stmKeys.length > 0,
          stmOk + " / " + stmKeys.length, t("tag.stmMissing", { n: stmKeys.length - stmOk }))) +
      row(t("row.modelLayer"), roles.layerdiff
          ? '<span class="tag ok">' + esc(t("tag.present")) + '</span> <span class="dim">' + esc(roles.layerdiff.rel) + "</span>"
          : '<span class="tag warn">' + esc(t("tag.missing")) + "</span>") +
      row(t("row.modelDepth"), roles.depth
          ? '<span class="tag ok">' + esc(t("tag.present")) + '</span> <span class="dim">' + esc(roles.depth.rel) + "</span>"
          : '<span class="tag warn">' + esc(t("tag.missing")) + "</span>") +
      row(t("row.patch"), tag(patchDone === patchKeys.length,
          patchDone + " / " + patchKeys.length, patchDone + " / " + patchKeys.length)) +
      "</div>");

    html += section(t("sec.output"), '<div class="rows">' +
      row(t("row.jobs"), esc(String(outs.jobs || 0))) +
      row(t("row.space"), esc((outs.size_gb || 0) + " GB")) +
      row(t("row.latest"), plain(outs.latest)) +
      "</div>");

    el("content-maint").innerHTML = html;
  }

  function renderAll() {
    renderEnv();
    renderStartup();
    renderMaint();
  }

  /* ───────────────────────── 诊断文本 ───────────────────────── */
  function diagnostics() {
    if (!data) return "";
    var hw = data.hardware || {};
    var gpu = hw.gpu || {};
    var rt = data.runtime || {};
    var patches = data.patches || {};
    var m = data.maintenance || {};
    var srv = data.server || {};
    return [
      t("diag.title"),
      "Python " + rt.python + " | torch " + rt.torch + " | CUDA " + (rt.cuda || "-"),
      t("diag.gpu") + " " + (gpu.name || "-") + " | VRAM " + (gpu.memory_mb ? gb(gpu.memory_mb) : "-") +
        " | " + t("row.driver") + " " + (gpu.driver || "-"),
      t("diag.os") + " " + hw.os + " | CPU " + (hw.cpu || "-") + " | RAM " + (hw.ram_gb || "-") + " GB",
      t("diag.extra") + " " + (rt.xformers || t("tag.notInstalled")) + " | triton " + (rt.triton || t("tag.notInstalled")),
      t("diag.patch") + " use_lama=" + patches.use_lama + " layer_fix_drop=" + patches.layer_fix_drop +
        " layer_fix_order=" + patches.layer_fix_order,
      t("diag.models") + " " + (data.models || []).map(function (item) { return item.name + "(" + item.role + ")"; }).join(", "),
      t("diag.hf") + " " + (hw.hf_endpoint || t("diag.auto")) +
        (hw.hf_latency_ms != null ? " · " + hw.hf_latency_ms + " ms" : ""),
      t("diag.listen") + " " + data.config.host + ":" + data.config.port + " | PID " + srv.pid +
        " | " + t("row.uptime") + " " + uptime(srv.uptime_s),
      t("diag.jobs") + " " + ((m.outputs || {}).jobs || 0) + " · " + ((m.outputs || {}).size_gb || 0) + " GB",
      t("diag.disk") + " " + data.disk.free_gb + " GB / " + data.disk.total_gb + " GB",
      t("row.components") + " " + ((data.components || {}).hf_home || "-") +
        " (" + ((data.components || {}).source === "project" ? "project" : "user") +
        ", " + ((data.components || {}).size_gb || 0) + " GB)",
      t("diag.path") + " " + data.paths.root
    ].join("\n");
  }

  /* ───────────────────────── 视图切换 ───────────────────────── */
  var currentView = "env";

  function showView(name) {
    if (VIEWS.indexOf(name) < 0) name = "env";
    currentView = name;
    VIEWS.forEach(function (key) {
      el("view-" + key).hidden = key !== name;
    });
    Array.prototype.forEach.call(el("railNav").querySelectorAll("a"), function (a) {
      var on = a.dataset.view === name;
      a.classList.toggle("active", on);
      if (on) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    document.title = t("title.page") + " · " + t("title." + name);
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function viewFromHash() { return (location.hash || "").replace("#", "") || "env"; }

  /* ───────────────────────── 语言 ───────────────────────── */
  function applyI18n() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (node) {
      node.textContent = t(node.dataset.i18n);
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-html]"), function (node) {
      node.innerHTML = t(node.dataset.i18nHtml);
    });
    var copy = el("copyBtn");
    if (copy && !copy.dataset.busy) copy.textContent = t("btn.copy");
    showView(viewFromHash());
  }

  function switchLang(next) {
    lang = next === "en" ? "en" : "zh";
    applyI18n();
    if (data) renderAll();
  }

  window.addEventListener("storage", function (event) {
    if (event.key !== LS_LANG && event.key !== null) return;
    var next = localStorage.getItem(LS_LANG) === "en" ? "en" : "zh";
    if (next !== lang) switchLang(next);
  });

  el("railNav").addEventListener("click", function (event) {
    var link = event.target.closest("a");
    if (!link) return;
    event.preventDefault();
    var name = link.dataset.view;
    if (viewFromHash() === name) showView(name);
    else location.hash = name;
  });

  window.addEventListener("hashchange", function () { showView(viewFromHash()); });

  /* ───────────────────────── 复制诊断 / 打开目录 / 终端 ───────────────────────── */
  el("copyBtn").addEventListener("click", function () {
    var text = diagnostics();
    if (!text) return;
    var btn = el("copyBtn");
    var done = function (label) {
      btn.dataset.busy = "1";
      btn.textContent = label;
      setTimeout(function () { delete btn.dataset.busy; btn.textContent = t("btn.copy"); }, 1500);
    };
    navigator.clipboard.writeText(text).then(function () { done(t("btn.copied")); })
      .catch(function () { done(t("btn.copyFail")); });
  });

  function syncTermButton() {
    if (!el("termBtn")) return;
    if (data && data.server && data.server.local_request === false) {
      el("termBtn").disabled = true;
      el("termBtn").title = t("err.localOnly", { action: t("btn.terminal") });
    }
  }

  el("termBtn").addEventListener("click", function () {
    var note = el("maintNote");
    var map = {
      local_only: t("err.localOnly", { action: t("btn.terminal") }),
      unsupported: t("err.unsupported"),
      missing_env_bat: t("err.missingEnvBat"),
      spawn_failed: t("err.spawnFailed")
    };
    note.textContent = t("note.termSending");
    fetch("/api/terminal", { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (payload) {
        note.textContent = payload && payload.ok
          ? t("note.termOpened")
          : t("note.termFail", { error: map[(payload || {}).error] || t("err.unknown") });
      })
      .catch(function () { note.textContent = t("note.noResponse"); });
  });

  Array.prototype.forEach.call(document.querySelectorAll(".actions [data-target]"), function (btn) {
    btn.addEventListener("click", function () {
      var note = el("maintNote");
      note.textContent = t("note.opening");
      fetch("/api/open-folder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target: btn.dataset.target })
      })
        .then(function (r) { return r.json(); })
        .then(function (payload) {
          if (payload && payload.ok) {
            note.textContent = t("note.opened", { path: payload.path });
          } else {
            var map = {
              invalid_target: t("err.invalidTarget"),
              not_found: t("err.notFound"),
              open_failed: t("err.openFailed"),
              local_only: t("err.localOnly", { action: t("btn.openOutputs") })
            };
            note.textContent = t("note.openFail", { error: map[(payload || {}).error] || t("err.unknown") });
          }
        })
        .catch(function () { note.textContent = t("note.noResponse"); });
    });
  });

  /* ───────────────────────── 启动 ───────────────────────── */
  applyI18n();

  fetch("/api/env")
    .then(function (r) { return r.json(); })
    .then(function (payload) {
      data = payload;
      renderAll();
      startUptimeTick();
      syncTermButton();
    })
    .catch(function () {
      var failed = '<div class="rows"><p class="empty">' + esc(t("err.readFail")) + "</p></div>";
      el("content").innerHTML = failed;
      el("content-startup").innerHTML = failed;
      el("content-maint").innerHTML = failed;
    });
})();
</script>
</body>
</html>
